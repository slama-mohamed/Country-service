apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: country-service
  template:
    metadata:
      labels:
        app: country-service
    spec:
      containers:
        - name: country-service-container
          image: mohamedslamaa/country-service:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
